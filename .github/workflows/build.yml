name: build
permissions: {}
on: [push, pull_request]
jobs:

  vetlint:
    runs-on: ubuntu-latest
    name: Go vet lint

    steps:

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Setup go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.27'

    - name: Vet
      run: |
        go vet ./...

    - name: Lint
      run: |
        go install golang.org/x/lint/golint@latest
        golint ./...

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm, arm64, s390x]
        go: ['1.27.1', '1.26.8']
      fail-fast: false

    name: Go ${{ matrix.go }} ${{ matrix.goos }} ${{ matrix.goarch }} build

    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: 6
      GOTOOLCHAIN: go${{ matrix.go }}

    steps:

    - name: Install qemu-user
      run: |
        sudo apt-get update
        sudo apt-get -y install qemu-user

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Setup go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: ${{ matrix.go }}

    - name: Get dependencies
      run: |
        go get -v -t -d ./...

    - name: Build
      run: |
        go build -v ./...

    - name: Test
      run: |
        go test -v --tags unit ./...

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        go: ['1.27.1', '1.26.8']
      fail-fast: false

    name: Go ${{ matrix.go }} macOS

    env:
      GOTOOLCHAIN: go${{ matrix.go }}

    steps:

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Setup go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: ${{ matrix.go }}

    - name: Get dependencies
      run: |
        go get -v -t -d ./...

    - name: Build
      run: |
        go build -v ./...

    - name: Test
      run: |
        go test -v --tags unit ./...

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        go: ['1.27.1', '1.26.8']
      fail-fast: false

    name: Go ${{ matrix.go }} Windows

    env:
      GOTOOLCHAIN: go${{ matrix.go }}

    steps:

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Setup go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: ${{ matrix.go }}

    - name: Get dependencies
      run: |
        go get -v -t -d ./...

    - name: Build
      run: |
        go build -v ./...

    - name: Test
      run: |
        go test -v --tags unit ./...

  all-builds:
    name: All builds passed
    runs-on: ubuntu-latest
    needs: [vetlint, build-linux, build-macos, build-windows]
    steps:
      - run: echo "All builds passed"
